# Canvas configuration for CS425/525 - Computer Networks
#
# Everything about scheduling is derived from the [term] skeleton below, so
# rolling this course to a new semester means changing `first_monday` and the
# four other dates, not editing seventy timestamps.
#
#   edutools dates docs/cs425 --show
#   edutools push  docs/cs425 --course 48194 --dry-run

[term]
timezone                = "America/Boise"
first_monday            = 2026-08-24   # first Monday of instruction, Fall 2026
weeks                   = 15
break_after_week        = 13           # Thanksgiving break, Nov 23-27 2026
last_day_of_instruction = 2026-12-11
finals_start            = 2026-12-14
finals_end              = 2026-12-18
# Grades are weighted by Canvas assignment group (Exams 50%, In Class 40%,
# Projects 10%), so there is no fixed point total to check against.
total_points            = 0

# How each kind of gradable item is scheduled inside its week. No `unlock`, so
# Canvas leaves "Available from" blank and an item is visible once published.
# `grace_days` is the gap between due_at and lock_at; the syllabus promises 2
# days with no penalty, and nothing is accepted past the last day of instruction.
[term.policy.project]
due        = "tue 23:59"
grace_days = 2

# In class activities are done and submitted during the class period they run in,
# so there is no grace period. Wednesday is the second meeting of the week.
[term.policy.lab]
due        = "wed 23:59"
grace_days = 0

[term.policy.discussion]
due        = "sun 23:59"
grace_days = 2

[term.policy.exam]
due        = "fri 23:59"
grace_days = 0

# ---------------------------------------------------------------------------
# Canvas assignment groups, in the order the syllabus lists them. The weights
# here are the weights in the Assessments table of index.md, and `edutools push`
# turns on weight-by-group for the course, so these are what Canvas computes the
# final grade from. Extra credit sits on top of a full 100 on purpose.
#
# The names have to match the groups already in Canvas character for character,
# because a push pairs them up by name and would otherwise create a second group
# beside the one that is already there.
#
# Exams carry half the grade and have nothing in this repo: the exam guides
# publish as pages and the exams themselves are Canvas quizzes built by hand, so
# the group is declared with no kinds and the quizzes are filed into it in Canvas.
# ---------------------------------------------------------------------------

[[group]]
name   = "Exams"
weight = 50

[[group]]
name   = "In Class Activities and Knowledge checks"
weight = 40
kinds  = ["lab", "quiz", "discussion"]

[[group]]
name   = "Projects"
weight = 10
kinds  = ["project"]

# No weight on purpose. Extra credit stays at 0% all semester and is raised to
# 2.5% by hand at the end, just before final grades are pushed. A weight declared
# here would be written back over that on the next push; leaving it out means a
# push positions the group and never touches what Canvas holds.
[[group]]
name = "Extra Credit"

# ---------------------------------------------------------------------------
# What this repo calls its files. This directory is a VitePress site as well as a
# Canvas course repo, so the syllabus is index.md rather than syllabus.md and the
# projects are p0.md rather than lab-0.md.
# ---------------------------------------------------------------------------

[layout]
syllabus = "index.md"
pages = [
    "objectives.md",
    "resources.md",
    "glossary.md",
    "notes/*.md",
    "assignments/index.md",
    "activities/index.md",
    "assignments/grading-rubric.md",
    "assignments/*-exam-guide.md",
]
# The textbook PDF under docs/ stays out of Canvas; it is already provided there
# under Course Materials.
files = []

[layout.gradable]
project    = "assignments/p[0-9]*.md"
lab        = "activities/a[0-9]*.md"
discussion = "discussions/*.md"

# Per-item exceptions to the policy above, keyed by path relative to this file.

# P1 lands the week the application layer wraps up, and Friday gives the class
# both lectures on SMTP and DNS before it is due instead of one.
[override."assignments/p1.md"]
due = "fri 23:59"

# ---------------------------------------------------------------------------
# Canvas modules. `page` is the module overview; `items` are published in order.
# Every key is a path relative to this file and must exist, or the push reports
# it as unpublished rather than silently skipping it.
# ---------------------------------------------------------------------------

[[module]]
title = "Week 1-2: Computer Networks and the Internet"
page  = "notes/ch01-internet.md"
items = ["assignments/p0.md"]

[[module]]
title = "Week 3-4: The Application Layer"
page  = "notes/ch02-application.md"
items = [
    "activities/a1-application-layer.md",
    "activities/a2-connectivity-triage.md",
    "activities/a3-name-the-layer.md",
    "assignments/p1.md",
]

[[module]]
title = "Week 5-6: The Transport Layer"
page  = "notes/ch03-transport.md"
items = ["assignments/p2.md"]

[[module]]
title = "Week 7: The Network Layer - Data Plane"
page  = "notes/ch04-network-data.md"
items = ["assignments/p3.md"]

[[module]]
title = "Week 8: Midterm Exam"
page  = "notes/midterm-review.md"
items = ["assignments/midterm-exam-guide.md"]

[[module]]
title = "Week 9-10: The Network Layer - Control Plane"
page  = "notes/ch05-network-control.md"

[[module]]
title = "Week 11-12: The Link Layer and LANs"
page  = "notes/ch06-link.md"
items = ["assignments/p4.md"]

[[module]]
title = "Week 13: Wireless and Mobile Networks"
page  = "notes/ch07-wireless.md"

[[module]]
title = "Week 14-15: Security in Computer Networks"
page  = "notes/ch08-security.md"

[[module]]
title = "Finals Week"
page  = "notes/final-review.md"
items = ["assignments/final-exam-guide.md"]
