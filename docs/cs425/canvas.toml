# Canvas configuration for CS425/525 - Computer Networks
#
# Everything about scheduling is derived from the [term] skeleton below, so
# rolling this course to a new semester means changing `first_monday` and the
# four other dates, not editing seventy timestamps.
#
#   edutools dates docs/cs425 --show
#   edutools push  docs/cs425 --course 48194 --dry-run

[term]
timezone                = "America/Boise"
first_monday            = 2026-08-24   # first Monday of instruction, Fall 2026
weeks                   = 15
break_after_week        = 13           # Thanksgiving break, Nov 23-27 2026
last_day_of_instruction = 2026-12-11
finals_start            = 2026-12-14
finals_end              = 2026-12-18
# Grades are weighted by Canvas assignment group (Exams 50%, In Class 40%,
# Projects 10%), so there is no fixed point total to check against.
total_points            = 0

# How each kind of gradable item is scheduled inside its week. No `unlock`, so
# Canvas leaves "Available from" blank and an item is visible once published.
# `grace_days` is the gap between due_at and lock_at; the syllabus promises 2
# days with no penalty, and nothing is accepted past the last day of instruction.
[term.policy.project]
due        = "tue 23:59"
grace_days = 2

# In class activities are done and submitted during the class period they run in,
# so there is no grace period. Thursday is the second meeting of the week.
[term.policy.lab]
due        = "thu 23:59"
grace_days = 0

[term.policy.discussion]
due        = "sun 23:59"
grace_days = 2

[term.policy.exam]
due        = "fri 23:59"
grace_days = 0

# Extra credit is open until the last day of instruction, which is the Friday
# of calendar week 16 (week 15 of instruction, the week the extra credit meta
# lines name), and nothing is accepted after that.
[term.policy.extra]
due        = "fri 23:59"
grace_days = 0

# ---------------------------------------------------------------------------
# Canvas assignment groups, in the order the syllabus lists them. The weights
# here are the weights in the Assessments table of index.md, and `edutools push`
# turns on weight-by-group for the course, so these are what Canvas computes the
# final grade from. Extra credit sits on top of a full 100 on purpose.
#
# The names have to match the groups already in Canvas character for character,
# because a push pairs them up by name and would otherwise create a second group
# beside the one that is already there.
#
# The exams carry half the grade, a quarter each, and are Canvas quizzes built
# by hand, so their groups are declared with no kinds and the quizzes are filed
# into them in Canvas. The Midterm group also holds X1, the take home midterm
# alternative, and drops the lowest score so the better of the two counts. That
# drop rule is set in Canvas; a push never touches it.
# ---------------------------------------------------------------------------

[[group]]
name   = "Midterm"
weight = 25

[[group]]
name   = "Final"
weight = 25

[[group]]
name   = "In Class Activities and Knowledge checks"
weight = 40
kinds  = ["lab", "quiz", "discussion"]

[[group]]
name   = "Projects"
weight = 10
kinds  = ["project"]

# No weight on purpose. Extra credit stays at 0% all semester and is raised to
# 2.5% by hand at the end, just before final grades are pushed. A weight declared
# here would be written back over that on the next push; leaving it out means a
# push positions the group and never touches what Canvas holds.
[[group]]
name  = "Extra Credit"
kinds = ["extra"]

# ---------------------------------------------------------------------------
# What this repo calls its files. This directory is a VitePress site as well as a
# Canvas course repo, so the syllabus is index.md rather than syllabus.md and the
# projects are p0.md rather than lab-0.md.
# ---------------------------------------------------------------------------

[layout]
syllabus = "index.md"
pages = [
    "objectives.md",
    "resources.md",
    "glossary.md",
    "notes/*.md",
    "assignments/index.md",
    "activities/index.md",
    "assignments/grading-rubric.md",
]
# The activity worksheets. The real PDFs live in docs/public/cs425/activities/,
# because that is the only place VitePress serves them from; the entries under
# activities/ are symlinks to them, so that the push finds the files inside the
# course directory, uploads them, and rewrites each page's relative link to the
# Canvas file. Listed one by one rather than globbed, because a file is never a
# draft: a worksheet would go up while its page is still held back. Add a
# worksheet here when its page loses `draft: true`; until then the push reports
# the page's link as unresolved, which is the reminder.
# The textbook PDF under docs/ stays out of Canvas; it is already provided there
# under Course Materials.
files = [
    "activities/a1-worksheet.pdf",
    "activities/a2-worksheet.pdf",
    "activities/a3-worksheet.pdf",
    "activities/a4-worksheet.pdf",
    "activities/a5-worksheet.pdf",
    "activities/a6-worksheet.pdf",
    "activities/a7-worksheet.pdf",
    "activities/a9-worksheet.pdf",
    # P2's diagrams, linked the same way from docs/public/cs425/assignments/.
    "assignments/p2-setup.svg",
    "assignments/p2-window.svg",
    "assignments/p2-gbn-timeline.svg",
    # The relay students run themselves; a copy of relay/cs425_relay.py from
    # the CS425-p2-solution repo.
    "assignments/cs425_relay.py",
    # P4's captures, built by scripts/make-zip.sh in the CS425-p4-solution repo.
    "assignments/p4-captures.zip",
    # A8's worksheet, and the meter students download onto Onyx and run.
    "activities/a8-worksheet.pdf",
    "activities/tcpmeter.py",
]

[layout.gradable]
# Take home mini-labs (m1-*.md) sit beside the projects and count in the same
# group, so one glob catches both. X1, the midterm alternative, is a project by
# kind too, and its override below files it into the Midterm group.
project    = "assignments/[pmx][0-9]*.md"
lab        = "activities/a[0-9]*.md"
extra      = "extra-credit/ec-*.md"
discussion = "discussions/*.md"

# Per-item exceptions to the policy above, keyed by path relative to this file.

# P1 lands the week the application layer wraps up, and Friday gives the class
# both lectures on SMTP and DNS before it is due instead of one.
[override."assignments/p1.md"]
due = "fri 23:59"

# P2 is the transport project: students work on it in weeks 5-6, so it sits in that module,
# and it is due Friday of week 7.
[override."assignments/p2.md"]
due = "fri 23:59"

# P3 is due Friday of week 10, Oct 30.
[override."assignments/p3.md"]
due = "fri 23:59"

# P4 is due Friday of week 13, Nov 20.
[override."assignments/p4.md"]
due = "fri 23:59"

# A1 and A2 ran on Wednesdays, before the activities settled on Thursday. These
# keep the dates students already saw.
[override."activities/a1-application-layer.md"]
due = "wed 23:59"

[override."activities/a2-stop-typing-your-password.md"]
due = "wed 23:59"

# A3 moved to week 6 and is due that Tuesday, Sep 29.
[override."activities/a3-claude-transport.md"]
due = "tue 23:59"

# M1 is a one hour take home mini-lab, due Thursday of week 6 (Oct 1) with the
# usual two days of grace, rather than on a project Tuesday.
[override."assignments/m1-copilot-cli.md"]
due        = "thu 23:59"
grace_days = 2

# X1 is the take home alternative to the midterm. It is due when the midterm
# closes, Friday of week 8, with no grace period because it replaces an exam,
# and it counts in the Midterm group, which keeps the better of the two scores.
[override."assignments/x1-page-load.md"]
due        = "fri 23:59"
grace_days = 0
group      = "Midterm"

# ---------------------------------------------------------------------------
# Canvas modules. `page` is the module overview; `items` are published in order.
# Every key is a path relative to this file and must exist, or the push reports
# it as unpublished rather than silently skipping it.
# ---------------------------------------------------------------------------

# `canvas` names objects that live only in Canvas, built by hand: the knowledge
# check quizzes and the exams. A push rebuilds every module from this file, so a
# quiz that is not listed here falls out of its module on the next push.
# The pages that are not tied to a week. A push creates the module unpublished
# and never publishes it without --publish, so it stays hidden this term. Publish
# it by hand at the end of the semester.
[[module]]
title = "Start Here"
items = [
    "notes/course-introduction.md",
    "objectives.md",
    "resources.md",
    "glossary.md",
]

[[module]]
title  = "Week 1-2: Computer Networks and the Internet"
page   = "notes/ch01-internet.md"
items  = ["assignments/p0.md"]
canvas = [{ quiz = 393657, title = "Chapter 1 - Knowledge Check" }]

# Each activity's slides are a page on the website (they need the site's slide
# viewer, so they are not a Canvas page), linked just ahead of the activity.
[[module]]
title  = "Week 3-4: The Application Layer"
page   = "notes/ch02-application.md"
items  = [
    { url = "https://shanepanter.com/cs425/activities/slides-a1", title = "A1 Slides" },
    "activities/a1-application-layer.md",
    { url = "https://shanepanter.com/cs425/activities/slides-a2", title = "A2 Slides" },
    "activities/a2-stop-typing-your-password.md",
    "assignments/p1.md",
]
