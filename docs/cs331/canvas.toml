# ---------------------------------------------------------------------------
# Canvas modules, in the shape of the Boise State Online shell (course 52107):
# Course Resources, Getting Started, then one "Module N" per week. `page` is the
# module's first page; `items` follow in order. Every key is a path relative to
# this file and must exist, or the push reports it as unpublished rather than
# silently skipping it.
#
# Each week is two pages, as in the shell: "Module N Overview" (introduction,
# learning objectives, and what is due when) and "N.01 Readings and Lecture
# Notes", followed by that week's graded work.
#
# A module is matched to Canvas by title. The shell's own placeholder modules
# ("Getting Started (start date - end date)", "Module 1: Title (...)") have
# different titles, so a push builds these beside them rather than over them.
# ---------------------------------------------------------------------------

# The shell's Instructor Resources module, rebuilt from the shared pages.
# never_publish: every push writes this module and everything in it unpublished,
# ignoring --publish and pulling back anything published in the Canvas UI, and
# locks the module until 2099 so a stray publish still shows students nothing.
# `edutools verify` fails if any of it is ever found published.
[[module]]
title = "Instructor Resources (leave unpublished)"
never_publish = true
items = [
    "instructor-resources/instructor-guide.md",
    "instructor-resources/course-suggestions.md",
    "instructor-resources/learning-opportunities.md",
]

# Course Resources is for students from day one. publish: every push publishes
# this module and everything in it, with or without --publish. Instructor
# Information, the readings page and the objectives are this course's own; the
# other three are shared by every course from shared/course-resources/.
[[module]]
title = "Course Resources"
publish = true
items = [
    "instructor.md",
    "course-resources/canvas-resources.md",
    "course-resources/online-success-resources.md",
    "course-resources/technology-support.md",
    "resources.md",
    "objectives.md",
    "course-resources/course-questions.md",
]

# Every module but Course Resources follows the shell: its overview page, then
# its items under "Due by" text headers, each item numbered N.0K in its title.
# `week` puts the dates in the module's name, from the term skeleton above.
# D1, Lab 0 and the diagnostic are week 1 work, but they are course setup, so
# they sit in Getting Started. The Getting to Know You Survey is the shell's own
# ungraded survey, kept by id.
[[module]]
title = "Getting Started"
week  = 1
page  = "getting-started.md"
items = [
    { header = "Due by Tuesday at 11:59 p.m. Mountain Time" },
    "communicating.md",
    "quizzes/quiz-00-diagnostic.md",
