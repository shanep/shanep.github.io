    "assignments/lab-05-hashing-and-signatures.md",
    "quizzes/quiz-03-cryptography.md",
]

# An exam guide publishes as a Canvas page, not as an assignment: edutools maps
# the `exam` kind to a page on purpose, because the exam itself is a Canvas quiz
# built by hand. Once that quiz exists, add it here as
# `canvas = [{ quiz = <id>, title = "Midterm Exam" }]` so a push keeps it in the
# module. Until then the module carries the guide and the quiz sits outside it.
[[module]]
title = "Week 9: Review and Midterm"
page  = "notes/week-09-review-and-midterm.md"
items = ["assignments/midterm-exam-guide.md"]

[[module]]
