    { header = "Due by Thursday at 11:59 p.m. Mountain Time" },
    "discussions/d01-introductions-and-security-mindset.md",
    { header = "Due by Sunday at 11:59 p.m. Mountain Time" },
    "reminders/d01-replies.md",
    "assignments/lab-00-course-setup.md",
