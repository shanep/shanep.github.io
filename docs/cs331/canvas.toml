# The finals-week items carry "**Finals week · ...**" instead of a week number,
# which is what tells edutools to date them from the finals window rather than
# from a Monday. The final exam quiz is hand built in Canvas like the midterm;
# add it here as `canvas = [{ quiz = <id>, title = "Final Exam" }]`.
[[module]]
title = "Finals Week"
items = [
    "assignments/final-exam-guide.md",
    "discussions/d06-final-reflection.md",
]
