# front of a section heading. edutools uploads each file below and inserts an
# <img class="cs-icon"> into every h2 or h3 whose text matches the key (case is
# ignored, * matches anything, first match wins). The images are the shell's own
# icon set, pulled from course 52107 into docs/public/icons/, which every course
# shares: docs/cs331/icons is a symlink to it. Only the icons named here upload.
