<line x1="250" y1="390" x2="598" y2="440" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#mbc4c00)"/>
<line x1="250" y1="410" x2="598" y2="460" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#mbc4c00)"/>
<line x1="600" y1="400" x2="252" y2="450" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<line x1="600" y1="420" x2="252" y2="470" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<line x1="600" y1="440" x2="252" y2="490" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<line x1="600" y1="460" x2="252" y2="510" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<text x="234" y="84" text-anchor="end" fill="#1f2328" font-weight="400">send DATA 0</text>
<text x="234" y="104" text-anchor="end" fill="#1f2328" font-weight="400">send DATA 1</text>
<text x="234" y="124" text-anchor="end" fill="#cf222e" font-weight="600">send DATA 2 (lost on the way)</text>
<text x="234" y="144" text-anchor="end" fill="#1f2328" font-weight="400">send DATA 3 (window of 4 full)</text>
<text x="234" y="184" text-anchor="end" fill="#1f2328" font-weight="400">ACK 1: base 1, send DATA 4</text>
<text x="234" y="204" text-anchor="end" fill="#1f2328" font-weight="400">ACK 2: base 2, send DATA 5</text>
<text x="234" y="244" text-anchor="end" fill="#57606a" font-weight="400">ACK 2 again: duplicate, ignore</text>
<text x="234" y="284" text-anchor="end" fill="#57606a" font-weight="400">ACK 2 again: duplicate, ignore</text>
<text x="234" y="304" text-anchor="end" fill="#57606a" font-weight="400">ACK 2 again: duplicate, ignore</text>
<text x="234" y="354" text-anchor="end" fill="#bc4c00" font-weight="600">TIMEOUT: go back, resend 2 to 5</text>
<text x="234" y="454" text-anchor="end" fill="#1f2328" font-weight="400">ACK 3: base 3</text>
<text x="234" y="474" text-anchor="end" fill="#1f2328" font-weight="400">ACK 4: base 4</text>
<text x="234" y="494" text-anchor="end" fill="#1f2328" font-weight="400">ACK 5: base 5</text>
<text x="234" y="514" text-anchor="end" fill="#1f2328" font-weight="400">ACK 6: all DATA acknowledged</text>
<text x="612" y="134" text-anchor="start" fill="#1f2328" font-weight="400">DATA 0 is expected: write, ACK 1</text>
<text x="612" y="154" text-anchor="start" fill="#1f2328" font-weight="400">DATA 1 is expected: write, ACK 2</text>
<text x="612" y="194" text-anchor="start" fill="#57606a" font-weight="400">DATA 3, expected 2: discard, ACK 2</text>
<text x="612" y="234" text-anchor="start" fill="#57606a" font-weight="400">DATA 4, expected 2: discard, ACK 2</text>
<text x="612" y="254" text-anchor="start" fill="#57606a" font-weight="400">DATA 5, expected 2: discard, ACK 2</text>
<text x="612" y="404" text-anchor="start" fill="#1f2328" font-weight="400">DATA 2 is expected: write, ACK 3</text>
<text x="612" y="424" text-anchor="start" fill="#1f2328" font-weight="400">DATA 3 is expected: write, ACK 4</text>
<text x="612" y="444" text-anchor="start" fill="#1f2328" font-weight="400">DATA 4 is expected: write, ACK 5</text>
<text x="612" y="464" text-anchor="start" fill="#1f2328" font-weight="400">DATA 5 is expected: write, ACK 6</text>
<text x="234" y="329" text-anchor="end" fill="#bc4c00" font-weight="400">timer for DATA 2 runs out</text>
<line x1="110" y1="572" x2="144" y2="572" stroke="#0969da" stroke-width="2" marker-end="url(#m0969da)"/>
<text x="152" y="576" fill="#1f2328">DATA</text>
<line x1="204" y1="572" x2="238" y2="572" stroke="#1a7f37" stroke-width="2" marker-end="url(#m1a7f37)"/>
<text x="246" y="576" fill="#1f2328">ACK</text>
<line x1="291" y1="572" x2="325" y2="572" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m8c959f)"/>
<text x="333" y="576" fill="#1f2328">duplicate ACK</text>
<line x1="448" y1="572" x2="482" y2="572" stroke="#bc4c00" stroke-width="2" marker-end="url(#mbc4c00)"/>
<text x="490" y="576" fill="#1f2328">retransmitted DATA</text>
<rect x="640" y="564" width="5" height="16" rx="2" fill="#bc4c00" opacity="0.8"/><text x="652" y="576" fill="#1f2328">timer (each gap is a restart)</text>
</svg>
