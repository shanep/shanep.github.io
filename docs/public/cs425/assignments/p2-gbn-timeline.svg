<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t">
<title id="t">Go-Back-N with a window of 4: DATA 2 is lost, the receiver discards 3, 4 and 5 and repeats ACK 2, the sender times out and resends 2 through 5</title>
<defs><marker id="m0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="m1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="m8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="mbc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="609" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="430.0" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Go-Back-N, window 4, six DATA packets, DATA 2 lost (time runs down the page)</text>
<text x="250" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">sender</text>
<text x="600" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">receiver</text>
