<svg xmlns="http://www.w3.org/2000/svg" class="wf-svg wf-wide" viewBox="0 0 920 712" role="img" aria-labelledby="p2-gbn-timeline-wide-title p2-gbn-timeline-wide-desc" data-diagram="p2-gbn-timeline/wide"><title id="p2-gbn-timeline-wide-title">Go-Back-N timeline with DATA 2 lost</title><desc id="p2-gbn-timeline-wide-desc">Go-Back-N with a window of 4 and six DATA packets, where DATA 2 is lost. Time runs down the page. The sender sends DATA 0 to 3; DATA 2 is lost on the way. The receiver writes DATA 0 and 1 and sends ACK 1 and ACK 2. ACK 1 moves base to 1 and the sender sends DATA 4; ACK 2 moves base to 2 and it sends DATA 5. DATA 3, 4 and 5 arrive while the receiver expects 2, so it discards each and repeats ACK 2, and the sender ignores the duplicates. The timer for DATA 2 runs out, so the sender goes back and resends 2 to 5. The receiver writes each in order and sends ACK 3 to 6, which move base until all DATA is acknowledged. The timer restarts on each ACK that moves base and on the timeout.</desc><style>.wf-svg{--wf-bg:var(--vp-c-bg,#ffffff);--wf-text-1:var(--vp-c-text-1,#0f1a28);--wf-text-2:var(--vp-c-text-2,#313c4a);--wf-divider:var(--vp-c-divider,#d8e0ea);font-family:var(--vp-font-family-base,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}.wf-tone-blue{--wf-fill:#eef4ff;--wf-tab:#d6e4ff;--wf-line:#2f62d6;--wf-ink:#1b3a86;}.wf-tone-purple{--wf-fill:#f5f1ff;--wf-tab:#e6dcff;--wf-line:#7444d8;--wf-ink:#47208f;}.wf-tone-orange{--wf-fill:#fff3ea;--wf-tab:#ffe0c9;--wf-line:#c4520f;--wf-ink:#77290c;}.wf-tone-green{--wf-fill:#edf9f1;--wf-tab:#d2f0dc;--wf-line:#1d8146;--wf-ink:#0f3d22;}.wf-tone-red{--wf-fill:#fff0f0;--wf-tab:#ffdada;--wf-line:#c02626;--wf-ink:#761818;}.wf-tone-yellow{--wf-fill:#fff7d6;--wf-tab:#ffeaa8;--wf-line:#946200;--wf-ink:#553800;}.wf-tone-gray{--wf-fill:#f1f3f6;--wf-tab:#e1e6ec;--wf-line:#5d6878;--wf-ink:#262d38;}.wf-card{fill:var(--wf-bg);stroke:var(--wf-divider);}.wf-region{fill:var(--wf-fill,var(--wf-bg));stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.5;}.wf-tab{fill:var(--wf-tab);}.wf-icon{fill:none;stroke:var(--wf-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.wf-region-label{fill:var(--wf-ink,var(--wf-text-1));font-size:15px;font-weight:700;}.wf-shadow{flood-color:#0b1530;flood-opacity:0.16;}.wf-box{fill:var(--wf-bg);stroke:var(--wf-line,var(--wf-text-2));stroke-width:2;}.wf-filled .wf-box,.wf-swatch{fill:var(--wf-fill);}.wf-planned .wf-box{stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round;}.wf-label{fill:var(--wf-text-1);font-size:17px;font-weight:600;}.wf-sub,.wf-note{fill:var(--wf-text-2);font-size:14px;}.wf-note{font-style:italic;}.wf-text,.wf-key{fill:var(--wf-ink,var(--wf-text-1));font-size:14px;}.wf-key{fill:var(--wf-text-1);}.wf-bold{font-weight:700;}.wf-mono{font-family:var(--vp-font-family-mono,ui-monospace,Menlo,Consolas,monospace);}.wf-edge{fill:none;stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.75;}.wf-heavy{stroke:var(--wf-text-1);stroke-width:4;}.wf-dashed{stroke-dasharray:6 4;}.wf-bar{stroke-width:5;stroke-linecap:round;}.wf-head{fill:var(--wf-line,var(--wf-text-2));}.wf-label-bg{fill:var(--wf-bg);stroke:var(--wf-divider);stroke-width:1;}.wf-edge-label{fill:var(--wf-text-1);font-size:14px;}.wf-dot .wf-dot,.wf-branch .wf-dot{fill:var(--wf-text-2);}.wf-landed .wf-dot{fill:var(--wf-bg);stroke:var(--wf-text-1);stroke-width:4;}.wf-x{fill:none;stroke:var(--wf-text-1);stroke-width:3;stroke-linecap:round;}.wf-badge-dot{fill:var(--wf-text-1);}.wf-badge-num{fill:var(--wf-bg);font-size:14px;font-weight:700;}</style><defs><marker id="p2-gbn-timeline-wide-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" class="wf-tone-blue"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><marker id="p2-gbn-timeline-wide-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" class="wf-tone-green"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><marker id="p2-gbn-timeline-wide-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" class="wf-tone-gray"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><marker id="p2-gbn-timeline-wide-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" class="wf-tone-orange"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><filter id="p2-gbn-timeline-wide-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" class="wf-shadow"/></filter></defs><rect x="1" y="1" width="918" height="710" rx="12" class="wf-card"/><path d="M300 82 L300 606" class="wf-edge"/><path d="M600 82 L600 606" class="wf-edge"/><path d="M300 100 L598 155" class="wf-edge wf-tone-blue" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><path d="M300 122 L598 177" class="wf-edge wf-tone-blue" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><path d="M300 144 L466.1475409836066 174.46038251366122" class="wf-edge wf-tone-blue"/><path d="M300 166 L598 221" class="wf-edge wf-tone-blue" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><path d="M600 155 L302 210" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M600 177 L302 232" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M300 210 L598 265" class="wf-edge wf-tone-blue" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><path d="M300 232 L598 287" class="wf-edge wf-tone-blue" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><path d="M600 221 L302 276" class="wf-edge wf-dashed wf-tone-gray" marker-end="url(#p2-gbn-timeline-wide-arrow-gray)"/><path d="M600 265 L302 320" class="wf-edge wf-dashed wf-tone-gray" marker-end="url(#p2-gbn-timeline-wide-arrow-gray)"/><path d="M600 287 L302 342" class="wf-edge wf-dashed wf-tone-gray" marker-end="url(#p2-gbn-timeline-wide-arrow-gray)"/><path d="M300 397 L598 452" class="wf-edge wf-tone-orange" marker-end="url(#p2-gbn-timeline-wide-arrow-orange)"/><path d="M600 452 L302 507" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M300 419 L598 474" class="wf-edge wf-tone-orange" marker-end="url(#p2-gbn-timeline-wide-arrow-orange)"/><path d="M600 474 L302 529" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M300 441 L598 496" class="wf-edge wf-tone-orange" marker-end="url(#p2-gbn-timeline-wide-arrow-orange)"/><path d="M600 496 L302 551" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M300 463 L598 518" class="wf-edge wf-tone-orange" marker-end="url(#p2-gbn-timeline-wide-arrow-orange)"/><path d="M600 518 L302 573" class="wf-edge wf-tone-green" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><path d="M291 103 L291 207" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 213 L291 229" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 235 L291 394" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 400 L291 504" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 510 L291 526" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 532 L291 548" class="wf-edge wf-bar wf-tone-purple"/><path d="M291 554 L291 570" class="wf-edge wf-bar wf-tone-purple"/><g class="wf-text"><text x="460" y="30" class="wf-text wf-bold" text-anchor="middle">Go-Back-N, window 4, six DATA packets, DATA 2 lost (time runs down the page)</text></g><g class="wf-step"><rect x="240" y="46" width="120" height="36" rx="10" class="wf-box" filter="url(#p2-gbn-timeline-wide-shadow)"/><text x="300" y="69.5" class="wf-label" text-anchor="middle">sender</text></g><g class="wf-step"><rect x="540" y="46" width="120" height="36" rx="10" class="wf-box" filter="url(#p2-gbn-timeline-wide-shadow)"/><text x="600" y="69.5" class="wf-label" text-anchor="middle">receiver</text></g><g class="wf-text"><text x="280" y="105" class="wf-text" text-anchor="end">send DATA 0</text></g><g class="wf-text"><text x="280" y="127" class="wf-text" text-anchor="end">send DATA 1</text></g><g class="wf-text"><text x="280" y="149" class="wf-text wf-bold" text-anchor="end">send DATA 2 (lost on the way)</text></g><g class="wf-lost"><path d="M468 169.08333333333334 L482 183.08333333333334 M482 169.08333333333334 L468 183.08333333333334" class="wf-x"/></g><g class="wf-text"><text x="280" y="171" class="wf-text" text-anchor="end">send DATA 3 (window of 4 full)</text></g><g class="wf-text"><text x="614" y="160" class="wf-text">DATA 0 is expected: write, ACK 1</text></g><g class="wf-text"><text x="614" y="182" class="wf-text">DATA 1 is expected: write, ACK 2</text></g><g class="wf-text"><text x="280" y="215" class="wf-text" text-anchor="end">ACK 1: base 1, send DATA 4</text></g><g class="wf-text"><text x="280" y="237" class="wf-text" text-anchor="end">ACK 2: base 2, send DATA 5</text></g><g class="wf-text"><text x="614" y="226" class="wf-text">DATA 3, expected 2: discard, ACK 2</text></g><g class="wf-text"><text x="280" y="281" class="wf-text" text-anchor="end">ACK 2 again: duplicate, ignore</text></g><g class="wf-text"><text x="614" y="270" class="wf-text">DATA 4, expected 2: discard, ACK 2</text></g><g class="wf-text"><text x="614" y="292" class="wf-text">DATA 5, expected 2: discard, ACK 2</text></g><g class="wf-text"><text x="280" y="325" class="wf-text" text-anchor="end">ACK 2 again: duplicate, ignore</text></g><g class="wf-text"><text x="280" y="347" class="wf-text" text-anchor="end">ACK 2 again: duplicate, ignore</text></g><g class="wf-text wf-tone-purple"><text x="280" y="380" class="wf-text" text-anchor="end">timer for DATA 2 runs out</text></g><g class="wf-text wf-tone-orange"><text x="280" y="402" class="wf-text wf-bold" text-anchor="end">TIMEOUT: go back, resend 2 to 5</text></g><g class="wf-text"><text x="614" y="457" class="wf-text">DATA 2 is expected: write, ACK 3</text></g><g class="wf-text"><text x="614" y="479" class="wf-text">DATA 3 is expected: write, ACK 4</text></g><g class="wf-text"><text x="614" y="501" class="wf-text">DATA 4 is expected: write, ACK 5</text></g><g class="wf-text"><text x="614" y="523" class="wf-text">DATA 5 is expected: write, ACK 6</text></g><g class="wf-text"><text x="280" y="512" class="wf-text" text-anchor="end">ACK 3: base 3</text></g><g class="wf-text"><text x="280" y="534" class="wf-text" text-anchor="end">ACK 4: base 4</text></g><g class="wf-text"><text x="280" y="556" class="wf-text" text-anchor="end">ACK 5: base 5</text></g><g class="wf-text"><text x="280" y="578" class="wf-text" text-anchor="end">ACK 6: all DATA acknowledged</text></g><g class="wf-key wf-tone-blue"><path d="M40 650 L74 650" class="wf-edge" marker-end="url(#p2-gbn-timeline-wide-arrow-blue)"/><text x="84" y="655" class="wf-key">DATA</text></g><g class="wf-key wf-tone-green"><path d="M148 650 L182 650" class="wf-edge" marker-end="url(#p2-gbn-timeline-wide-arrow-green)"/><text x="192" y="655" class="wf-key">ACK</text></g><g class="wf-key wf-tone-gray"><path d="M248 650 L282 650" class="wf-edge wf-dashed" marker-end="url(#p2-gbn-timeline-wide-arrow-gray)"/><text x="292" y="655" class="wf-key">duplicate ACK</text></g><g class="wf-key wf-tone-orange"><path d="M424 650 L458 650" class="wf-edge" marker-end="url(#p2-gbn-timeline-wide-arrow-orange)"/><text x="468" y="655" class="wf-key">retransmitted DATA, and the TIMEOUT that sends it</text></g><g class="wf-key wf-tone-purple"><path d="M57 675 L57 693" class="wf-edge wf-bar"/><text x="84" y="689" class="wf-key">timer, and when it runs out (each gap is a restart)</text></g></svg>
