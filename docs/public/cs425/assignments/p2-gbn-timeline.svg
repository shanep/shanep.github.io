<line x1="600" y1="62" x2="600" y2="535" stroke="#1f2328" stroke-width="2"/>
<line x1="20" y1="550" x2="840" y2="550" stroke="#d0d7de"/>
<rect x="241" y="492" width="5" height="18" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="472" width="5" height="18" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="452" width="5" height="18" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="352" width="5" height="98" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="202" width="5" height="148" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="182" width="5" height="18" rx="2" fill="#bc4c00" opacity="0.8"/>
<rect x="241" y="82" width="5" height="98" rx="2" fill="#bc4c00" opacity="0.8"/>
<line x1="250" y1="80" x2="598" y2="130" stroke="#0969da" stroke-width="1.8" marker-end="url(#m0969da)"/>
<line x1="250" y1="100" x2="598" y2="150" stroke="#0969da" stroke-width="1.8" marker-end="url(#m0969da)"/>
<line x1="250" y1="120" x2="425.0" y2="145.0" stroke="#cf222e" stroke-width="1.8"/>
<path d="M418.0,138.0 L432.0,152.0 M432.0,138.0 L418.0,152.0" stroke="#cf222e" stroke-width="3"/>
<line x1="250" y1="140" x2="598" y2="190" stroke="#0969da" stroke-width="1.8" marker-end="url(#m0969da)"/>
<line x1="600" y1="130" x2="252" y2="180" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<line x1="600" y1="150" x2="252" y2="200" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#m1a7f37)"/>
<line x1="600" y1="190" x2="252" y2="240" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8c959f)"/>
<line x1="250" y1="180" x2="598" y2="230" stroke="#0969da" stroke-width="1.8" marker-end="url(#m0969da)"/>
<line x1="250" y1="200" x2="598" y2="250" stroke="#0969da" stroke-width="1.8" marker-end="url(#m0969da)"/>
<line x1="600" y1="230" x2="252" y2="280" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8c959f)"/>
<line x1="600" y1="250" x2="252" y2="300" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8c959f)"/>
