<svg xmlns="http://www.w3.org/2000/svg" class="wf-svg wf-wide" viewBox="0 0 880 400" role="img" aria-labelledby="p2-setup-wide-title p2-setup-wide-desc" data-diagram="p2-setup/wide"><title id="p2-setup-wide-title">The P2 setup: sender, relay and receiver</title><desc id="p2-setup-wide-desc">Three programs run on your machine. myapp send reads in.bin, cuts it into 1024 byte packets, and keeps a window of them in flight with one timer. It sends DATA and FIN to the relay on UDP port 4250, which forwards them to myapp recv and carries the ACKs back. The relay can hold each datagram 50 ms (--delay), drop it (-l loss), flip one bit (-c) or deliver it twice (-d), each way. myapp recv writes out.bin one packet at a time, strictly in order, and ACKs every packet it gets. To start: 1, the receiver says HELLO jdoe-1 recv. 2, the sender says HELLO jdoe-1 send 0.1 0.05 0, with its damage rates. 3, the relay answers OK to each, then forwards the rest. Hellos and their OK replies are never damaged. Use one socket for the whole run: the relay knows you by address and port.</desc><style>.wf-svg{--wf-bg:var(--vp-c-bg,#ffffff);--wf-text-1:var(--vp-c-text-1,#0f1a28);--wf-text-2:var(--vp-c-text-2,#313c4a);--wf-divider:var(--vp-c-divider,#d8e0ea);font-family:var(--vp-font-family-base,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}.wf-tone-blue{--wf-fill:#eef4ff;--wf-tab:#d6e4ff;--wf-line:#2f62d6;--wf-ink:#1b3a86;}.wf-tone-purple{--wf-fill:#f5f1ff;--wf-tab:#e6dcff;--wf-line:#7444d8;--wf-ink:#47208f;}.wf-tone-orange{--wf-fill:#fff3ea;--wf-tab:#ffe0c9;--wf-line:#c4520f;--wf-ink:#77290c;}.wf-tone-green{--wf-fill:#edf9f1;--wf-tab:#d2f0dc;--wf-line:#1d8146;--wf-ink:#0f3d22;}.wf-tone-red{--wf-fill:#fff0f0;--wf-tab:#ffdada;--wf-line:#c02626;--wf-ink:#761818;}.wf-tone-yellow{--wf-fill:#fff7d6;--wf-tab:#ffeaa8;--wf-line:#946200;--wf-ink:#553800;}.wf-tone-gray{--wf-fill:#f1f3f6;--wf-tab:#e1e6ec;--wf-line:#5d6878;--wf-ink:#262d38;}.wf-card{fill:var(--wf-bg);stroke:var(--wf-divider);}.wf-region{fill:var(--wf-fill,var(--wf-bg));stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.5;}.wf-tab{fill:var(--wf-tab);}.wf-icon{fill:none;stroke:var(--wf-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.wf-region-label{fill:var(--wf-ink,var(--wf-text-1));font-size:15px;font-weight:700;}.wf-shadow{flood-color:#0b1530;flood-opacity:0.16;}.wf-box{fill:var(--wf-bg);stroke:var(--wf-line,var(--wf-text-2));stroke-width:2;}.wf-filled .wf-box,.wf-swatch{fill:var(--wf-fill);}.wf-planned .wf-box{stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round;}.wf-label{fill:var(--wf-text-1);font-size:17px;font-weight:600;}.wf-sub,.wf-note{fill:var(--wf-text-2);font-size:14px;}.wf-note{font-style:italic;}.wf-text,.wf-key{fill:var(--wf-ink,var(--wf-text-1));font-size:14px;}.wf-key{fill:var(--wf-text-1);}.wf-bold{font-weight:700;}.wf-mono{font-family:var(--vp-font-family-mono,ui-monospace,Menlo,Consolas,monospace);}.wf-edge{fill:none;stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.75;}.wf-heavy{stroke:var(--wf-text-1);stroke-width:4;}.wf-dashed{stroke-dasharray:6 4;}.wf-bar{stroke-width:5;stroke-linecap:round;}.wf-head{fill:var(--wf-line,var(--wf-text-2));}.wf-label-bg{fill:var(--wf-bg);stroke:var(--wf-divider);stroke-width:1;}.wf-edge-label{fill:var(--wf-text-1);font-size:14px;}.wf-dot .wf-dot,.wf-branch .wf-dot{fill:var(--wf-text-2);}.wf-landed .wf-dot{fill:var(--wf-bg);stroke:var(--wf-text-1);stroke-width:4;}.wf-x{fill:none;stroke:var(--wf-text-1);stroke-width:3;stroke-linecap:round;}.wf-badge-dot{fill:var(--wf-text-1);}.wf-badge-num{fill:var(--wf-bg);font-size:14px;font-weight:700;}</style><defs><marker id="p2-setup-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><filter id="p2-setup-wide-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" class="wf-shadow"/></filter></defs><rect x="1" y="1" width="878" height="398" rx="12" class="wf-card"/><g class="wf-tone-blue"><rect x="8" y="8" width="864" height="384" rx="14" class="wf-region"/><rect x="16" y="16" width="146" height="28" rx="14" class="wf-tab"/><path d="M2 3.5h12v8H2z M0 13.5h16" transform="translate(28 22)" class="wf-icon"/><text x="50" y="35" class="wf-region-label">Your machine</text></g><path d="M235 124 L333 124" class="wf-edge" marker-end="url(#p2-setup-wide-arrow)"/><path d="M547 124 L645 124" class="wf-edge" marker-end="url(#p2-setup-wide-arrow)"/><path d="M645 176 L547 176" class="wf-edge" marker-end="url(#p2-setup-wide-arrow)"/><path d="M333 176 L235 176" class="wf-edge" marker-end="url(#p2-setup-wide-arrow)"/><g class="wf-step wf-tone-blue"><rect x="25" y="88" width="210" height="124" rx="10" class="wf-box" filter="url(#p2-setup-wide-shadow)"/><text x="130" y="119.5" class="wf-label" text-anchor="middle">myapp send</text><text x="130" y="141.5" class="wf-sub" text-anchor="middle">reads in.bin, cuts it</text><text x="130" y="159.5" class="wf-sub" text-anchor="middle">into 1024 byte packets,</text><text x="130" y="177.5" class="wf-sub" text-anchor="middle">keeps a window of them</text><text x="130" y="195.5" class="wf-sub" text-anchor="middle">in flight, one timer</text></g><g class="wf-step wf-tone-blue"><rect x="333" y="70" width="214" height="160" rx="10" class="wf-box" filter="url(#p2-setup-wide-shadow)"/><text x="440" y="101.5" class="wf-label" text-anchor="middle">relay</text><text x="440" y="123.5" class="wf-sub" text-anchor="middle">UDP port 4250</text><text x="440" y="141.5" class="wf-sub" text-anchor="middle">each datagram, each way:</text><text x="440" y="159.5" class="wf-sub" text-anchor="middle">held 50 ms (--delay)</text><text x="440" y="177.5" class="wf-sub" text-anchor="middle">dropped (-l loss)</text><text x="440" y="195.5" class="wf-sub" text-anchor="middle">one bit flipped (-c)</text><text x="440" y="213.5" class="wf-sub" text-anchor="middle">delivered twice (-d)</text></g><g class="wf-step wf-tone-blue"><rect x="645" y="88" width="210" height="124" rx="10" class="wf-box" filter="url(#p2-setup-wide-shadow)"/><text x="750" y="119.5" class="wf-label" text-anchor="middle">myapp recv</text><text x="750" y="141.5" class="wf-sub" text-anchor="middle">writes out.bin, one</text><text x="750" y="159.5" class="wf-sub" text-anchor="middle">packet at a time, strictly</text><text x="750" y="177.5" class="wf-sub" text-anchor="middle">in order, and ACKs</text><text x="750" y="195.5" class="wf-sub" text-anchor="middle">every packet it gets</text></g><g class="wf-badge"><circle cx="42" cy="282" r="12" class="wf-badge-dot"/><text x="42" y="287" class="wf-badge-num" text-anchor="middle">1</text></g><g class="wf-text"><text x="64" y="278" class="wf-text">receiver says</text></g><g class="wf-text"><text x="64" y="300" class="wf-text wf-mono">HELLO jdoe-1 recv</text></g><g class="wf-badge"><circle cx="316" cy="282" r="12" class="wf-badge-dot"/><text x="316" y="287" class="wf-badge-num" text-anchor="middle">2</text></g><g class="wf-text"><text x="338" y="278" class="wf-text">sender says, with its damage rates</text></g><g class="wf-text"><text x="338" y="300" class="wf-text wf-mono">HELLO jdoe-1 send 0.1 0.05 0</text></g><g class="wf-badge"><circle cx="640" cy="282" r="12" class="wf-badge-dot"/><text x="640" y="287" class="wf-badge-num" text-anchor="middle">3</text></g><g class="wf-text"><text x="662" y="278" class="wf-text">relay answers OK to each,</text><text x="662" y="296" class="wf-text">then forwards the rest</text></g><g class="wf-note"><text x="440" y="346" class="wf-note" text-anchor="middle">Hellos and their OK replies are never damaged.</text><text x="440" y="364" class="wf-note" text-anchor="middle">Use one socket for the whole run: the relay knows you by address and port.</text></g><rect x="244.72" y="89" width="78.56" height="22" rx="11" class="wf-label-bg"/><text x="284" y="105" class="wf-edge-label" text-anchor="middle">DATA, FIN</text><rect x="556.72" y="89" width="78.56" height="22" rx="11" class="wf-label-bg"/><text x="596" y="105" class="wf-edge-label" text-anchor="middle">DATA, FIN</text><rect x="580.24" y="189" width="31.520000000000003" height="22" rx="11" class="wf-label-bg"/><text x="596" y="205" class="wf-edge-label" text-anchor="middle">ACK</text><rect x="268.24" y="189" width="31.520000000000003" height="22" rx="11" class="wf-label-bg"/><text x="284" y="205" class="wf-edge-label" text-anchor="middle">ACK</text></svg>
