<svg xmlns="http://www.w3.org/2000/svg" class="wf-svg wf-wide" viewBox="0 0 700 316" role="img" aria-labelledby="g-harness-wide-title g-harness-wide-desc" data-diagram="g-harness/wide"><title id="g-harness-wide-title">The same stack under your tests</title><desc id="g-harness-wide-desc">One Linux process, started by make check. Your Unity tests own the clock and call sim_advance(). They drive two copies of your stack, each joined to the simulator through netif_t. The simulator between them adds delay, a rate limit, a queue, loss, duplicates, reordering and corruption. In the kernel, netif_t is your virtio-net driver instead.</desc><style>.wf-svg{--wf-bg:var(--vp-c-bg,#ffffff);--wf-text-1:var(--vp-c-text-1,#0f1a28);--wf-text-2:var(--vp-c-text-2,#313c4a);--wf-divider:var(--vp-c-divider,#d8e0ea);font-family:var(--vp-font-family-base,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}.wf-tone-blue{--wf-fill:#eef4ff;--wf-tab:#d6e4ff;--wf-line:#2f62d6;--wf-ink:#1b3a86;}.wf-tone-purple{--wf-fill:#f5f1ff;--wf-tab:#e6dcff;--wf-line:#7444d8;--wf-ink:#47208f;}.wf-tone-orange{--wf-fill:#fff3ea;--wf-tab:#ffe0c9;--wf-line:#c4520f;--wf-ink:#77290c;}.wf-tone-green{--wf-fill:#edf9f1;--wf-tab:#d2f0dc;--wf-line:#1d8146;--wf-ink:#0f3d22;}.wf-tone-red{--wf-fill:#fff0f0;--wf-tab:#ffdada;--wf-line:#c02626;--wf-ink:#761818;}.wf-tone-yellow{--wf-fill:#fff7d6;--wf-tab:#ffeaa8;--wf-line:#946200;--wf-ink:#553800;}.wf-tone-gray{--wf-fill:#f1f3f6;--wf-tab:#e1e6ec;--wf-line:#5d6878;--wf-ink:#262d38;}.wf-card{fill:var(--wf-bg);stroke:var(--wf-divider);}.wf-region{fill:var(--wf-fill,var(--wf-bg));stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.5;}.wf-tab{fill:var(--wf-tab);}.wf-icon{fill:none;stroke:var(--wf-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.wf-region-label{fill:var(--wf-ink,var(--wf-text-1));font-size:15px;font-weight:700;}.wf-shadow{flood-color:#0b1530;flood-opacity:0.16;}.wf-box{fill:var(--wf-bg);stroke:var(--wf-line,var(--wf-text-2));stroke-width:2;}.wf-filled .wf-box,.wf-swatch{fill:var(--wf-fill);}.wf-planned .wf-box{stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round;}.wf-label{fill:var(--wf-text-1);font-size:17px;font-weight:600;}.wf-sub,.wf-note{fill:var(--wf-text-2);font-size:14px;}.wf-note{font-style:italic;}.wf-text,.wf-key{fill:var(--wf-ink,var(--wf-text-1));font-size:14px;}.wf-key{fill:var(--wf-text-1);}.wf-bold{font-weight:700;}.wf-mono{font-family:var(--vp-font-family-mono,ui-monospace,Menlo,Consolas,monospace);}.wf-edge{fill:none;stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.75;}.wf-heavy{stroke:var(--wf-text-1);stroke-width:4;}.wf-dashed{stroke-dasharray:6 4;}.wf-bar{stroke-width:5;stroke-linecap:round;}.wf-head{fill:var(--wf-line,var(--wf-text-2));}.wf-label-bg{fill:var(--wf-bg);stroke:var(--wf-divider);stroke-width:1;}.wf-edge-label{fill:var(--wf-text-1);font-size:14px;}.wf-dot .wf-dot,.wf-branch .wf-dot{fill:var(--wf-text-2);}.wf-landed .wf-dot{fill:var(--wf-bg);stroke:var(--wf-text-1);stroke-width:4;}.wf-x{fill:none;stroke:var(--wf-text-1);stroke-width:3;stroke-linecap:round;}.wf-badge-dot{fill:var(--wf-text-1);}.wf-badge-num{fill:var(--wf-bg);font-size:14px;font-weight:700;}</style><defs><marker id="g-harness-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><filter id="g-harness-wide-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" class="wf-shadow"/></filter></defs><rect x="1" y="1" width="698" height="314" rx="12" class="wf-card"/><g class="wf-tone-blue"><rect x="8" y="8" width="684" height="300" rx="14" class="wf-region"/><rect x="16" y="16" width="299" height="28" rx="14" class="wf-tab"/><path d="M2 3.5h12v8H2z M0 13.5h16" transform="translate(28 22)" class="wf-icon"/><text x="50" y="35" class="wf-region-label">One Linux process, make check</text></g><path d="M180 182 L255 182" class="wf-edge"/><path d="M445 182 L520 182" class="wf-edge"/><path d="M200 84 L105 84 L105 159" class="wf-edge" marker-end="url(#g-harness-wide-arrow)"/><path d="M500 84 L595 84 L595 159" class="wf-edge" marker-end="url(#g-harness-wide-arrow)"/><g class="wf-step wf-tone-blue"><rect x="200" y="61" width="300" height="46" rx="10" class="wf-box" filter="url(#g-harness-wide-shadow)"/><text x="350" y="80.5" class="wf-label" text-anchor="middle">Your Unity tests</text><text x="350" y="102.5" class="wf-sub" text-anchor="middle">own the clock, call sim_advance()</text></g><g class="wf-step wf-tone-blue"><rect x="30" y="159" width="150" height="46" rx="10" class="wf-box" filter="url(#g-harness-wide-shadow)"/><text x="105" y="178.5" class="wf-label" text-anchor="middle">Your stack</text><text x="105" y="200.5" class="wf-sub" text-anchor="middle">host A</text></g><g class="wf-step wf-tone-blue"><rect x="255" y="137" width="190" height="90" rx="10" class="wf-box" filter="url(#g-harness-wide-shadow)"/><text x="350" y="160.5" class="wf-label" text-anchor="middle">Simulator</text><text x="350" y="182.5" class="wf-sub" text-anchor="middle">delay, rate, queue</text><text x="350" y="200.5" class="wf-sub" text-anchor="middle">loss, duplicates,</text><text x="350" y="218.5" class="wf-sub" text-anchor="middle">reordering, corruption</text></g><g class="wf-step wf-tone-blue"><rect x="520" y="159" width="150" height="46" rx="10" class="wf-box" filter="url(#g-harness-wide-shadow)"/><text x="595" y="178.5" class="wf-label" text-anchor="middle">Your stack</text><text x="595" y="200.5" class="wf-sub" text-anchor="middle">host B</text></g><g class="wf-text"><text x="350" y="276" class="wf-text" text-anchor="middle">In the kernel, netif_t is your virtio-net driver instead.</text></g><rect x="185.56" y="153" width="62.88" height="22" rx="11" class="wf-label-bg"/><text x="217" y="169" class="wf-edge-label" text-anchor="middle">netif_t</text><rect x="451.56" y="153" width="62.88" height="22" rx="11" class="wf-label-bg"/><text x="483" y="169" class="wf-edge-label" text-anchor="middle">netif_t</text></svg>
