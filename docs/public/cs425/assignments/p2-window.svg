<svg xmlns="http://www.w3.org/2000/svg" class="wf-svg wf-wide" viewBox="0 0 840 316" role="img" aria-labelledby="p2-window-wide-title p2-window-wide-desc" data-diagram="p2-window/wide"><title id="p2-window-wide-title">The sender's window over the packet numbers</title><desc id="p2-window-wide-desc">The sender's view of packet numbers 0 to 11, with base = 2, next = 5 and N = 6. Packets 0 and 1 are acknowledged: done and forgotten. Packets 2 to 4 are sent but not yet acknowledged, and kept for resending. Packets 5 to 7 may be sent now. Packets 8 and up are not yet sendable, because they are outside the window. The window covers packets 2 to 7. base points at packet 2 and next points at packet 5.</desc><style>.wf-svg{--wf-bg:var(--vp-c-bg,#ffffff);--wf-text-1:var(--vp-c-text-1,#0f1a28);--wf-text-2:var(--vp-c-text-2,#313c4a);--wf-divider:var(--vp-c-divider,#d8e0ea);font-family:var(--vp-font-family-base,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}.wf-tone-blue{--wf-fill:#eef4ff;--wf-tab:#d6e4ff;--wf-line:#2f62d6;--wf-ink:#1b3a86;}.wf-tone-purple{--wf-fill:#f5f1ff;--wf-tab:#e6dcff;--wf-line:#7444d8;--wf-ink:#47208f;}.wf-tone-orange{--wf-fill:#fff3ea;--wf-tab:#ffe0c9;--wf-line:#c4520f;--wf-ink:#77290c;}.wf-tone-green{--wf-fill:#edf9f1;--wf-tab:#d2f0dc;--wf-line:#1d8146;--wf-ink:#0f3d22;}.wf-tone-red{--wf-fill:#fff0f0;--wf-tab:#ffdada;--wf-line:#c02626;--wf-ink:#761818;}.wf-tone-yellow{--wf-fill:#fff7d6;--wf-tab:#ffeaa8;--wf-line:#946200;--wf-ink:#553800;}.wf-tone-gray{--wf-fill:#f1f3f6;--wf-tab:#e1e6ec;--wf-line:#5d6878;--wf-ink:#262d38;}.wf-card{fill:var(--wf-bg);stroke:var(--wf-divider);}.wf-region{fill:var(--wf-fill,var(--wf-bg));stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.5;}.wf-tab{fill:var(--wf-tab);}.wf-icon{fill:none;stroke:var(--wf-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.wf-region-label{fill:var(--wf-ink,var(--wf-text-1));font-size:15px;font-weight:700;}.wf-shadow{flood-color:#0b1530;flood-opacity:0.16;}.wf-box{fill:var(--wf-bg);stroke:var(--wf-line,var(--wf-text-2));stroke-width:2;}.wf-filled .wf-box,.wf-swatch{fill:var(--wf-fill);}.wf-planned .wf-box{stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round;}.wf-label{fill:var(--wf-text-1);font-size:17px;font-weight:600;}.wf-sub,.wf-note{fill:var(--wf-text-2);font-size:14px;}.wf-note{font-style:italic;}.wf-text,.wf-key{fill:var(--wf-ink,var(--wf-text-1));font-size:14px;}.wf-key{fill:var(--wf-text-1);}.wf-bold{font-weight:700;}.wf-mono{font-family:var(--vp-font-family-mono,ui-monospace,Menlo,Consolas,monospace);}.wf-edge{fill:none;stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.75;}.wf-heavy{stroke:var(--wf-text-1);stroke-width:4;}.wf-dashed{stroke-dasharray:6 4;}.wf-bar{stroke-width:5;stroke-linecap:round;}.wf-head{fill:var(--wf-line,var(--wf-text-2));}.wf-label-bg{fill:var(--wf-bg);stroke:var(--wf-divider);stroke-width:1;}.wf-edge-label{fill:var(--wf-text-1);font-size:14px;}.wf-dot .wf-dot,.wf-branch .wf-dot{fill:var(--wf-text-2);}.wf-landed .wf-dot{fill:var(--wf-bg);stroke:var(--wf-text-1);stroke-width:4;}.wf-x{fill:none;stroke:var(--wf-text-1);stroke-width:3;stroke-linecap:round;}.wf-badge-dot{fill:var(--wf-text-1);}.wf-badge-num{fill:var(--wf-bg);font-size:14px;font-weight:700;}</style><defs><marker id="p2-window-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><filter id="p2-window-wide-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" class="wf-shadow"/></filter></defs><rect x="1" y="1" width="838" height="314" rx="12" class="wf-card"/><path d="M160 98 L160 74 L536 74 L536 98" class="wf-edge"/><path d="M188 196 L188 158" class="wf-edge" marker-end="url(#p2-window-wide-arrow)"/><path d="M380 196 L380 158" class="wf-edge" marker-end="url(#p2-window-wide-arrow)"/><g class="wf-text"><text x="420" y="34" class="wf-text wf-bold" text-anchor="middle">The sender's view of the packet numbers, with base = 2, next = 5, N = 6</text></g><g class="wf-step wf-tone-green wf-filled"><rect x="32" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="60" y="135.5" class="wf-label" text-anchor="middle">0</text></g><g class="wf-step wf-tone-green wf-filled"><rect x="96" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="124" y="135.5" class="wf-label" text-anchor="middle">1</text></g><g class="wf-step wf-tone-yellow wf-filled"><rect x="160" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="188" y="135.5" class="wf-label" text-anchor="middle">2</text></g><g class="wf-step wf-tone-yellow wf-filled"><rect x="224" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="252" y="135.5" class="wf-label" text-anchor="middle">3</text></g><g class="wf-step wf-tone-yellow wf-filled"><rect x="288" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="316" y="135.5" class="wf-label" text-anchor="middle">4</text></g><g class="wf-step wf-tone-blue wf-filled"><rect x="352" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="380" y="135.5" class="wf-label" text-anchor="middle">5</text></g><g class="wf-step wf-tone-blue wf-filled"><rect x="416" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="444" y="135.5" class="wf-label" text-anchor="middle">6</text></g><g class="wf-step wf-tone-blue wf-filled"><rect x="480" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="508" y="135.5" class="wf-label" text-anchor="middle">7</text></g><g class="wf-step wf-tone-gray wf-filled"><rect x="544" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="572" y="135.5" class="wf-label" text-anchor="middle">8</text></g><g class="wf-step wf-tone-gray wf-filled"><rect x="608" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="636" y="135.5" class="wf-label" text-anchor="middle">9</text></g><g class="wf-step wf-tone-gray wf-filled"><rect x="672" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="700" y="135.5" class="wf-label" text-anchor="middle">10</text></g><g class="wf-step wf-tone-gray wf-filled"><rect x="736" y="105" width="56" height="50" rx="10" class="wf-box" filter="url(#p2-window-wide-shadow)"/><text x="764" y="135.5" class="wf-label" text-anchor="middle">11</text></g><g class="wf-text"><text x="810" y="136" class="wf-text" text-anchor="middle">…</text></g><g class="wf-text"><text x="188" y="216" class="wf-text wf-bold wf-mono" text-anchor="middle">base</text></g><g class="wf-text"><text x="380" y="216" class="wf-text wf-bold wf-mono" text-anchor="middle">next</text></g><g class="wf-key wf-tone-green"><rect x="46" y="243" width="22" height="22" rx="5" class="wf-box wf-swatch"/><text x="84" y="259" class="wf-key">acknowledged: done, forgotten</text></g><g class="wf-key wf-tone-yellow"><rect x="406" y="243" width="22" height="22" rx="5" class="wf-box wf-swatch"/><text x="444" y="259" class="wf-key">sent, not yet acknowledged: kept for resending</text></g><g class="wf-key wf-tone-blue"><rect x="46" y="279" width="22" height="22" rx="5" class="wf-box wf-swatch"/><text x="84" y="295" class="wf-key">may be sent now</text></g><g class="wf-key wf-tone-gray"><rect x="406" y="279" width="22" height="22" rx="5" class="wf-box wf-swatch"/><text x="444" y="295" class="wf-key">not yet: outside the window</text></g><rect x="293.03999999999996" y="63" width="109.92000000000002" height="22" rx="11" class="wf-label-bg"/><text x="348" y="79" class="wf-edge-label" text-anchor="middle">window, N = 6</text></svg>
