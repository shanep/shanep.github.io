<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t">
<title id="t">The sender's window: packets below base are acknowledged, base to next minus one are in flight, next up to base plus N may be sent, and the rest must wait</title>
<rect x="0.5" y="0.5" width="759" height="231" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="380.0" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">The sender's view of the packet numbers, with base = 2, next = 5, N = 6</text>
<rect x="50" y="70" width="50" height="40" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="75.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">0</text><rect x="104" y="70" width="50" height="40" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="129.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">1</text><rect x="158" y="70" width="50" height="40" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="183.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">2</text><rect x="212" y="70" width="50" height="40" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="237.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">3</text><rect x="266" y="70" width="50" height="40" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="291.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">4</text><rect x="320" y="70" width="50" height="40" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="345.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">5</text><rect x="374" y="70" width="50" height="40" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="399.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">6</text><rect x="428" y="70" width="50" height="40" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="453.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">7</text><rect x="482" y="70" width="50" height="40" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="507.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">8</text><rect x="536" y="70" width="50" height="40" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="561.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">9</text><rect x="590" y="70" width="50" height="40" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="615.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">10</text><rect x="644" y="70" width="50" height="40" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="669.0" y="95" text-anchor="middle" font-weight="600" fill="#1f2328">11</text>
<path d="M156,62 L156,52 L480,52 L480,62" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="318.0" y="44" text-anchor="middle" font-weight="700" fill="#1f2328">window, N = 6</text>
<path d="M183.0,116 l-6,10 h12 z" fill="#1f2328"/><text x="183.0" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#1f2328">base</text>
<path d="M345.0,116 l-6,10 h12 z" fill="#1f2328"/><text x="345.0" y="144" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#1f2328">next</text>
<text x="694" y="95" fill="#57606a">…</text>
<rect x="50" y="164" width="16" height="16" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="74" y="177" fill="#1f2328">acknowledged: done, forgotten</text><rect x="390" y="164" width="16" height="16" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="414" y="177" fill="#1f2328">sent, not yet acknowledged: kept for resending</text><rect x="50" y="190" width="16" height="16" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="74" y="203" fill="#1f2328">may be sent now</text><rect x="390" y="190" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="414" y="203" fill="#1f2328">not yet: outside the window</text>
</svg>
