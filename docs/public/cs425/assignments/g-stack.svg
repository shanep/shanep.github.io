<svg xmlns="http://www.w3.org/2000/svg" class="wf-svg wf-wide" viewBox="0 0 700 444" role="img" aria-labelledby="g-stack-wide-title g-stack-wide-desc" data-diagram="g-stack/wide"><title id="g-stack-wide-title">Where the stack runs</title><desc id="g-stack-wide-desc">Two places. On your machine, curl connects to 127.0.0.1 port 8080, and QEMU user networking carries that connection into the guest. QEMU user networking ends TCP itself and answers DNS and ARP, and it writes every frame to build/packets.pcap for Wireshark. Inside QEMU, the unikernel holds the layers you write, from the top: the HTTP server in G4, then TCP in G1 next to UDP and DNS in G2, then IPv4, ICMP and routing in G2, then Ethernet and ARP in G3, then the virtio-net driver in G4, which talks to QEMU user networking.</desc><style>.wf-svg{--wf-bg:var(--vp-c-bg,#ffffff);--wf-text-1:var(--vp-c-text-1,#0f1a28);--wf-text-2:var(--vp-c-text-2,#313c4a);--wf-divider:var(--vp-c-divider,#d8e0ea);font-family:var(--vp-font-family-base,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif);}.wf-tone-blue{--wf-fill:#eef4ff;--wf-tab:#d6e4ff;--wf-line:#2f62d6;--wf-ink:#1b3a86;}.wf-tone-purple{--wf-fill:#f5f1ff;--wf-tab:#e6dcff;--wf-line:#7444d8;--wf-ink:#47208f;}.wf-tone-orange{--wf-fill:#fff3ea;--wf-tab:#ffe0c9;--wf-line:#c4520f;--wf-ink:#77290c;}.wf-tone-green{--wf-fill:#edf9f1;--wf-tab:#d2f0dc;--wf-line:#1d8146;--wf-ink:#0f3d22;}.wf-tone-red{--wf-fill:#fff0f0;--wf-tab:#ffdada;--wf-line:#c02626;--wf-ink:#761818;}.wf-tone-yellow{--wf-fill:#fff7d6;--wf-tab:#ffeaa8;--wf-line:#946200;--wf-ink:#553800;}.wf-tone-gray{--wf-fill:#f1f3f6;--wf-tab:#e1e6ec;--wf-line:#5d6878;--wf-ink:#262d38;}.wf-card{fill:var(--wf-bg);stroke:var(--wf-divider);}.wf-region{fill:var(--wf-fill,var(--wf-bg));stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.5;}.wf-tab{fill:var(--wf-tab);}.wf-icon{fill:none;stroke:var(--wf-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.wf-region-label{fill:var(--wf-ink,var(--wf-text-1));font-size:15px;font-weight:700;}.wf-shadow{flood-color:#0b1530;flood-opacity:0.16;}.wf-box{fill:var(--wf-bg);stroke:var(--wf-line,var(--wf-text-2));stroke-width:2;}.wf-filled .wf-box,.wf-swatch{fill:var(--wf-fill);}.wf-planned .wf-box{stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round;}.wf-label{fill:var(--wf-text-1);font-size:17px;font-weight:600;}.wf-sub,.wf-note{fill:var(--wf-text-2);font-size:14px;}.wf-note{font-style:italic;}.wf-text,.wf-key{fill:var(--wf-ink,var(--wf-text-1));font-size:14px;}.wf-key{fill:var(--wf-text-1);}.wf-bold{font-weight:700;}.wf-mono{font-family:var(--vp-font-family-mono,ui-monospace,Menlo,Consolas,monospace);}.wf-edge{fill:none;stroke:var(--wf-line,var(--wf-text-2));stroke-width:1.75;}.wf-heavy{stroke:var(--wf-text-1);stroke-width:4;}.wf-dashed{stroke-dasharray:6 4;}.wf-bar{stroke-width:5;stroke-linecap:round;}.wf-head{fill:var(--wf-line,var(--wf-text-2));}.wf-label-bg{fill:var(--wf-bg);stroke:var(--wf-divider);stroke-width:1;}.wf-edge-label{fill:var(--wf-text-1);font-size:14px;}.wf-dot .wf-dot,.wf-branch .wf-dot{fill:var(--wf-text-2);}.wf-landed .wf-dot{fill:var(--wf-bg);stroke:var(--wf-text-1);stroke-width:4;}.wf-x{fill:none;stroke:var(--wf-text-1);stroke-width:3;stroke-linecap:round;}.wf-badge-dot{fill:var(--wf-text-1);}.wf-badge-num{fill:var(--wf-bg);font-size:14px;font-weight:700;}</style><defs><marker id="g-stack-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="wf-head"/></marker><filter id="g-stack-wide-shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" class="wf-shadow"/></filter></defs><rect x="1" y="1" width="698" height="442" rx="12" class="wf-card"/><g class="wf-tone-blue"><rect x="8" y="8" width="252" height="428" rx="14" class="wf-region"/><rect x="16" y="16" width="146" height="28" rx="14" class="wf-tab"/><path d="M2 3.5h12v8H2z M0 13.5h16" transform="translate(28 22)" class="wf-icon"/><text x="50" y="35" class="wf-region-label">Your machine</text></g><g class="wf-tone-orange"><rect x="280" y="8" width="412" height="428" rx="14" class="wf-region"/><rect x="288" y="16" width="272" height="28" rx="14" class="wf-tab"/><path d="M4.5 13h7.5a3 3 0 0 0 .3-6 4.5 4.5 0 0 0-8.6 1.2A2.5 2.5 0 0 0 4.5 13z" transform="translate(300 22)" class="wf-icon"/><text x="322" y="35" class="wf-region-label">The unikernel, inside QEMU</text></g><path d="M392 95 L392 127" class="wf-edge"/><path d="M392 173 L392 205" class="wf-edge"/><path d="M584 173 L584 205" class="wf-edge"/><path d="M486 251 L486 283" class="wf-edge"/><path d="M486 329 L486 361" class="wf-edge"/><path d="M134 95 L134 193" class="wf-edge"/><path d="M134 263 L134 361" class="wf-edge" marker-end="url(#g-stack-wide-arrow)"/><path d="M244 228 L270 228 L270 384 L300 384" class="wf-edge"/><g class="wf-step wf-tone-blue"><rect x="24" y="49" width="220" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="134" y="68.5" class="wf-label" text-anchor="middle">curl</text><text x="134" y="90.5" class="wf-sub" text-anchor="middle">127.0.0.1:8080</text></g><g class="wf-step wf-tone-blue"><rect x="24" y="193" width="220" height="70" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="134" y="215.5" class="wf-label" text-anchor="middle">QEMU user networking</text><text x="134" y="237.5" class="wf-sub" text-anchor="middle">ends TCP itself,</text><text x="134" y="255.5" class="wf-sub" text-anchor="middle">answers DNS and ARP</text></g><g class="wf-step wf-tone-blue"><rect x="24" y="361" width="220" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="134" y="380.5" class="wf-label" text-anchor="middle">build/packets.pcap</text><text x="134" y="402.5" class="wf-sub" text-anchor="middle">open it in Wireshark</text></g><g class="wf-step wf-tone-orange"><rect x="300" y="49" width="184" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="392" y="68.5" class="wf-label" text-anchor="middle">HTTP server</text><text x="392" y="90.5" class="wf-sub" text-anchor="middle">G4 · http.c</text></g><g class="wf-step wf-tone-orange"><rect x="300" y="127" width="184" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="392" y="146.5" class="wf-label" text-anchor="middle">TCP</text><text x="392" y="168.5" class="wf-sub" text-anchor="middle">G1 · tcp.c</text></g><g class="wf-step wf-tone-orange"><rect x="496" y="127" width="176" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="584" y="146.5" class="wf-label" text-anchor="middle">UDP and DNS</text><text x="584" y="168.5" class="wf-sub" text-anchor="middle">G2 · udp.c, dns.c</text></g><g class="wf-step wf-tone-orange"><rect x="300" y="205" width="372" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="486" y="224.5" class="wf-label" text-anchor="middle">IPv4, ICMP and routing</text><text x="486" y="246.5" class="wf-sub" text-anchor="middle">G2 · ip.c</text></g><g class="wf-step wf-tone-orange"><rect x="300" y="283" width="372" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="486" y="302.5" class="wf-label" text-anchor="middle">Ethernet and ARP</text><text x="486" y="324.5" class="wf-sub" text-anchor="middle">G3 · eth.c, stack.c</text></g><g class="wf-step wf-tone-orange"><rect x="300" y="361" width="372" height="46" rx="10" class="wf-box" filter="url(#g-stack-wide-shadow)"/><text x="486" y="380.5" class="wf-label" text-anchor="middle">virtio-net driver</text><text x="486" y="402.5" class="wf-sub" text-anchor="middle">G4 · virtio_net.c</text></g></svg>
