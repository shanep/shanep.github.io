# Starts an unattended Claude session (shanep/claude-plugins/agent) when the
# deploy fails on master, when I label an issue "agent", on Mondays to update
# the npm packages, and on Thursdays to check the agent docs for drift. The session's change lands only after a second
# session reviews it and the site builds.

name: agent

on:
  workflow_run:
    workflows: [Deploy VitePress site to Pages]
    types: [completed]
    branches: [master]
  issues:
    types: [labeled]
  schedule:
    - cron: '0 15 * * 1'
    # The docs task. The task expression below matches this string, so change both.
    - cron: '0 15 * * 4'
  workflow_dispatch:
    inputs:
      job:
        description: Which scheduled task to run
        type: choice
        options: [npm, docs]
        default: npm

# One agent at a time, so two never race to land.
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  agent:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent' &&
       github.actor == github.repository_owner) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NPM_TASK: |
        Update the npm packages. Run npm outdated and npm audit, then
        npm update to move each package to the newest version its range in
        package.json allows. Move a package to a new major version only when
        npm audit needs it to clear an alert. Read the note on the vite
        override in CLAUDE.md first and keep it unless VitePress no longer
        needs it. Commit package.json and package-lock.json. If nothing is
        outdated or vulnerable, make no commit.
      DOCS_TASK: |
        Check the agent docs for drift. Read CLAUDE.md, README.md and every
        file in .claude/, and check each thing they say against the repo as
        it is now: paths and file names, npm scripts and their flags, commands
        and the files they write, the status of each task in a plan, and what
        the git log says has landed. A stale fact sends the next agent the
        wrong way, so fix each one that is clearly wrong and commit the fix,
        one commit per file, keeping the author's wording everywhere else.
        Do not change a rule or a decision, only facts that no longer match
        the repo. When two docs disagree, or you cannot tell which side is
        right, leave it for a person. If nothing is stale, make no commit.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - uses: shanep/claude-plugins/agent@main
        with:
          mode: >-
            ${{ github.event_name == 'workflow_run' && 'ci-fix' ||
                github.event_name == 'issues' && 'issue' || 'task' }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          check: npm run lint:md && npm run docs:build
          ci-workflows: static.yml
          task: >-
            ${{ (github.event.schedule == '0 15 * * 4' || inputs.job == 'docs')
                && env.DOCS_TASK || env.NPM_TASK }}
