name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      # The CV PDF is built from docs/cv/index.md with pandoc and Tectonic.
      # Tectonic downloads only the LaTeX packages the CV uses; caching them
      # takes the build from about a minute and a half to under a second.
      # TECTONIC_CACHE_DIR pins where that cache lives, since Tectonic's default
      # location changed between releases.
      - name: Set up pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.9'
      - name: Cache Tectonic packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tectonic-cache
          key: ${{ runner.os }}-tectonic-${{ hashFiles('scripts/cv/template.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-
      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: '0.17.0'
      # docs:build also builds the CV PDFs (docs/.vitepress/cv-pdf.ts).
      - name: Build with VitePress
        run: npm run docs:build
        env:
          TECTONIC_CACHE_DIR: ${{ runner.temp }}/tectonic-cache
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
